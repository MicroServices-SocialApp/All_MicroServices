name: Update and Deploy Microservices

on:
  repository_dispatch:
    types: [microservice_updated]
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SERVICE: ${{ github.event.client_payload.service_name }}
      SHA: ${{ github.event.client_payload.sha}}
    
    steps:
      - name: Checkout Parent Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_FOR_ALL_MICROSERVICES }}
          submodules: 'true'
          fetch-depth: 0

      - name: Update Specific Submodule Only
        run: |
          echo "Updating service: $SERVICE"
          # Configure Git
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"

          # 1. Update only the targeted submodule
          git submodule update --init --remote $SERVICE
          
          # 2. Navigate into it and ensure it's on the right SHA/Branch
          cd $SERVICE
          git checkout main
          git pull origin main
          cd ..

          # 3. Stage the specific pointer change back to parent
          git add $SERVICE

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.SERVICE }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE }}:${{ env.SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE }}:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE }}:buildcache,mode=max

      - name: Update Kustomize Image Tag
        run: |
          #install kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

          # Update the tag in k8s/kustomization.yaml
          cd k8s
          echo "Updating image tag for $SERVICE to $SHA"
          
          # Make sure the Kustomization file exists before editing
          if [ -f "kustomization.yaml" ]; then
             echo "Updating image tag for $SERVICE to $SHA"
             kustomize edit set image ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE }}=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE }}:${{ env.SHA }}
          else
             echo "Error: k8s/kustomization.yaml not found!"
             exit 1
          fi
          cd ..

      - name: Commit and Push Changes
        run: |
          # Stage the Kustomize change
          git add k8s/kustomization.yaml
          
          # Only commit if there are changes (prevents failure if something is weird)
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "deploy($SERVICE): update submodule and image tag to $SHA"
            git push origin main
          fi